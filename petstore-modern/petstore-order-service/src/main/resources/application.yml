server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: petstore-order-service
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/petstore?replicaSet=rs0
      auto-index-creation: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: petstore-order-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.petstore.*"

app:
  kafka:
    topics:
      order-created: petstore.orders.created
      order-approved: petstore.orders.approved
      order-completed: petstore.orders.completed
      order-dualwrite: petstore.orders.dualwrite
      order-dlq: petstore.orders.dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.petstore.order: DEBUG
