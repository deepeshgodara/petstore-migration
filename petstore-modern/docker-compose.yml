services:
  mongodb:
    image: mongo:7.0
    container_name: petstore-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: petstore
    entrypoint:
      - bash
      - -c
      - |
        /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all &
        MONGOPID=$$!
        echo "Waiting for MongoDB to start..."
        until mongosh --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
          sleep 1
        done
        echo "Initializing replica set rs0..."
        mongosh --eval 'try { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}) } catch (e) { print(e) }'
        wait $$MONGOPID
    volumes:
      - mongo-data:/data/db
    networks:
      - petstore-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: petstore-mongo-express
    restart: unless-stopped
    ports:
      - "8086:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - petstore-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: petstore-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: '4L62EnNxTSSDb8ZXupVMQg'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - petstore-network
    healthcheck:
      test: ["CMD-SHELL", "/bin/kafka-cluster cluster-id --bootstrap-server localhost:9092 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: petstore-kafka-ui
    restart: unless-stopped
    ports:
      - "8087:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: petstore-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka
    networks:
      - petstore-network

volumes:
  mongo-data:
    name: petstore_mongo_data
  kafka-data:
    name: petstore_kafka_data

networks:
  petstore-network:
    name: petstore_modern_network
    driver: bridge
